<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8d9e8"><title>Yoshi Jostar · Forma de pago</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#614653;background:linear-gradient(145deg,#fff6fa,#f8d9e8,#fff7fa);min-height:100vh}.wrap{max-width:620px;margin:auto;padding:18px 14px 30px}.hero{text-align:center}.logo{width:min(300px,76vw);display:block;margin:auto;filter:drop-shadow(0 7px 9px rgba(220,40,115,.12));background:transparent}h1{color:#ed287d;font-size:clamp(28px,7vw,40px);margin:0;font-weight:900}.subtitle{color:#ed287d;font-size:18px;font-weight:800;margin:8px 0 22px}.card{background:rgba(255,255,255,.94);border-radius:27px;padding:22px;box-shadow:0 10px 30px rgba(210,45,115,.15)}.title{color:#ed287d;font-size:23px;font-weight:900;margin:0 0 16px;text-align:center}.field{background:#fff7fa;border:2px solid #ffc3db;border-radius:17px;padding:13px 15px;margin:11px 0}.label{font-size:11px;color:#ed287d;font-weight:900}.value{font-size:18px;font-weight:800;margin-top:5px;word-break:break-word}.copy{width:100%;margin-top:7px;padding:11px;border:2px solid #ff9bc4;background:#fff;color:#ed287d;border-radius:13px;font-weight:900}.note{margin:18px 5px 0;text-align:center;font-size:13px;line-height:1.45;color:#765765}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:#614653;color:white;padding:11px 17px;border-radius:30px;font-weight:800;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}.sound{position:fixed;right:16px;bottom:16px;border:0;border-radius:50%;width:52px;height:52px;background:#ed287d;color:white;font-size:23px;box-shadow:0 6px 18px rgba(210,45,115,.3);cursor:pointer;z-index:10;display:none}</style></head><body><audio id="musica" src="kirbys-victory-dance.mp3" preload="auto"></audio><main class="wrap"><header class="hero"><img class="logo" src="yoshi-logo.png" alt="Yoshi Jostar Accesorios 3D"><h1>Forma de pago 💗</h1><p class="subtitle">Yoshi Jostar Accesorios 3D</p></header><section class="card"><h2 class="title">💳 Datos de pago</h2><div class="field"><div class="label">NOMBRE DEL TITULAR</div><div class="value" id="nombre">Joselin Reta</div><button class="copy" onclick="copiar('nombre')">📋 COPIAR NOMBRE</button></div><div class="field"><div class="label">NÚMERO DE CUENTA</div><div class="value" id="cuenta">722969010833612537</div><button class="copy" onclick="copiar('cuenta')">📋 COPIAR NÚMERO DE CUENTA</button></div></section><p class="note">Verifica los datos antes de realizar tu pago. 💗<br>Gracias por apoyar nuestro pequeño negocio.</p></main><button class="sound" id="sound" onclick="activarSonido()" aria-label="Activar sonido">🔊</button><div class="toast" id="toast"></div><script>var audio=document.getElementById('musica');var sound=document.getElementById('sound');function activarSonido(){audio.play().then(function(){sound.style.display='none';avisar('Sonido activado 🔊');}).catch(function(){avisar('No se pudo reproducir el sonido');})}function iniciarSonido(){audio.play().then(function(){sound.style.display='none';}).catch(function(){sound.style.display='block';});}function copiar(id){var t=document.getElementById(id).textContent.trim();if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){avisar('Copiado ✓');},function(){fallback(t);});}else fallback(t)}function fallback(t){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');avisar('Copiado ✓');}catch(e){avisar('No se pudo copiar')}document.body.removeChild(a)}function avisar(t){var x=document.getElementById('toast');x.textContent=t;x.className='toast show';setTimeout(function(){x.className='toast'},1600)}window.addEventListener('load',iniciarSonido);</script></body></html>
